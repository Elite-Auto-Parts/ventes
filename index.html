<style>
/* Layout: one-column phone app — sticky brand header, scrolling view, fixed bottom tab bar with a raised "Vente" button */
:root{
  --brand:#06279e; --brand-ink:#ffffff; --brand-soft:#e8ecfb;
  --bg:#f3f5fb; --surface:#ffffff; --fg:#141a33; --muted:#5d6584; --line:#dde2f0;
  --ok:#14804a; --ok-soft:#e3f4ea; --warn:#a45f00; --warn-soft:#fdf0db; --bad:#c0262d; --bad-soft:#fbe6e7;
  --pts:#06279e;
  --f-display:"Poppins",ui-rounded,"Segoe UI",system-ui,sans-serif;
  --f-body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --brand:#5b7cff; --brand-ink:#ffffff; --brand-soft:#1c2550;
  --bg:#0c1022; --surface:#161b33; --fg:#e9ecf8; --muted:#9aa2c3; --line:#2a3152;
  --ok:#4fd08b; --ok-soft:#123326; --warn:#f2b84b; --warn-soft:#3a2c10; --bad:#ff7a7f; --bad-soft:#3d1719; --pts:#8ea4ff; color-scheme:dark}}
:root[data-theme="dark"]{
  --brand:#5b7cff; --brand-ink:#ffffff; --brand-soft:#1c2550;
  --bg:#0c1022; --surface:#161b33; --fg:#e9ecf8; --muted:#9aa2c3; --line:#2a3152;
  --ok:#4fd08b; --ok-soft:#123326; --warn:#f2b84b; --warn-soft:#3a2c10; --bad:#ff7a7f; --bad-soft:#3d1719; --pts:#8ea4ff; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:#06279e}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:#06279e;color:#fff;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px}
.top-row{display:flex;align-items:center;gap:10px;max-width:720px;margin:0 auto}
.logo{height:34px;width:auto;flex:none;display:block}
.logo.big{height:auto;width:100%;max-width:230px}
.setup .brandmark{flex-direction:column;align-items:stretch;gap:14px}
.setup .badge-logo{background:#06279e;border-radius:16px;padding:22px 24px;display:flex;justify-content:center}
.who{flex:1;min-width:0}
.who b{font-family:var(--f-display);font-weight:600;font-size:16px;display:block;line-height:1.1}
.who small{opacity:.8;font-size:12px}
.net{font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;padding:4px 8px;border-radius:99px;background:rgba(255,255,255,.16);display:flex;align-items:center;gap:6px;white-space:nowrap}
.net i{width:7px;height:7px;border-radius:50%;background:#5ce39a;display:block}
.net.off i{background:#ffb74a}
.icon-btn{background:rgba(255,255,255,.14);border:0;color:#fff;width:38px;height:38px;border-radius:10px;display:grid;place-items:center;position:relative;flex:none}
.icon-btn svg{width:20px;height:20px}
.badge{position:absolute;top:-4px;right:-4px;background:#ff4d5a;color:#fff;font-size:11px;font-weight:700;min-width:18px;height:18px;border-radius:9px;display:grid;place-items:center;padding:0 4px}

main{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 110px;display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.sec-title{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:6px 2px -4px}

/* points hero */
.hero{background:linear-gradient(160deg,#06279e,#0d1f74);color:#fff;border:0;padding:18px}
.hero .lbl{font-size:12px;opacity:.85;letter-spacing:.06em;text-transform:uppercase;font-weight:600}
.hero .big{font-family:var(--f-display);font-size:44px;font-weight:700;line-height:1;margin-top:6px}
.hero .big small{font-size:16px;font-weight:500;opacity:.8}
.bar{height:10px;background:rgba(255,255,255,.18);border-radius:99px;overflow:hidden;margin-top:12px;position:relative}
.bar span{display:block;height:100%;background:#fff;border-radius:99px}
.bar em{position:absolute;top:0;height:100%;background:rgba(255,255,255,.45)}
.bar .tick{position:absolute;top:-4px;bottom:-4px;width:2px;background:rgba(255,255,255,.75);border-radius:1px;transform:translateX(-1px)}
.bar .tick.now{background:#ffd166;width:3px;top:-6px;bottom:-6px}
.ticks{position:relative;height:16px;margin-top:6px;font-size:10.5px;opacity:.9}
.ticks span{position:absolute;transform:translateX(-50%);white-space:nowrap}
.ticks span.cur{font-weight:700;color:#ffd166}
.sbar{position:relative;height:14px;border-radius:99px;background:linear-gradient(90deg,var(--brand-soft) 0 var(--z),var(--ok-soft) var(--z) 100%);overflow:visible;margin-top:4px}
.sbar>b{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:var(--brand)}
.sbar>i{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:var(--brand);opacity:.3}
.sbar .mk{position:absolute;top:-5px;bottom:-5px;width:2px;background:var(--fg);opacity:.55}
.sbar .mk.acc{background:var(--ok);opacity:1;width:3px}
.slab{position:relative;height:30px;font-size:11px;color:var(--muted);margin-top:4px}
.slab span{position:absolute;transform:translateX(-50%);text-align:center;line-height:1.25;white-space:nowrap}
.slab span.acc{color:var(--ok);font-weight:600}
.mapbox{height:58vh;min-height:320px;border-radius:var(--r);border:1px solid var(--line);overflow:hidden;background:var(--brand-soft);z-index:0}
[data-device="laptop"] .mapbox{height:calc(100vh - 220px)}
.leaflet-popup-content{font-family:var(--f-body);font-size:13px;margin:10px 12px}
.leaflet-popup-content b{font-size:14px}
.mapchips{display:flex;gap:6px;flex-wrap:wrap}
.lg{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--muted)}.lg i{width:10px;height:10px;border-radius:50%;display:inline-block}
.hero-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.hero-grid div{background:rgba(255,255,255,.1);border-radius:10px;padding:8px 10px}
.hero-grid b{display:block;font-family:var(--f-display);font-size:18px}
.hero-grid small{font-size:11px;opacity:.85}
.month-nav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.month-nav button{background:rgba(255,255,255,.14);border:0;color:#fff;border-radius:8px;width:30px;height:30px}

/* traffic light */
.feux{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.feu{border-radius:10px;padding:10px;background:var(--bg);border:1px solid var(--line)}
.feu .dot{width:12px;height:12px;border-radius:50%;display:inline-block;margin-right:6px;vertical-align:-1px}
.feu b{display:block;font-size:17px;font-family:var(--f-display);margin-top:2px}
.feu small{color:var(--muted);font-size:11.5px}
.g{background:var(--ok)} .y{background:var(--warn)} .r{background:var(--bad)}

/* rows */
.rows{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .main{flex:1;min-width:0}
.row .main b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .main small{color:var(--muted);font-size:12.5px}
.row .end{text-align:right;flex:none}
.row .end b{font-family:var(--f-display);font-weight:600}
.row.tap{cursor:pointer}
.pts{color:var(--pts);font-weight:700}
.mini-bar{height:6px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:5px}
.mini-bar span{display:block;height:100%;background:var(--brand)}
.mini-bar span.done{background:var(--ok)}

.chip{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:600;padding:3px 8px;border-radius:99px;white-space:nowrap}
.c-ok{background:var(--ok-soft);color:var(--ok)} .c-warn{background:var(--warn-soft);color:var(--warn)} .c-bad{background:var(--bad-soft);color:var(--bad)} .c-info{background:var(--brand-soft);color:var(--pts)} .c-mute{background:var(--bg);color:var(--muted);border:1px solid var(--line)}

/* controls */
.seg{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.seg button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:7px 12px;font-size:13px;font-weight:500;white-space:nowrap}
.seg button.on{background:var(--brand);border-color:var(--brand);color:#fff}
.seg button .n{opacity:.7;margin-left:4px}
.search{width:100%;padding:11px 12px;border:1px solid var(--line);background:var(--surface);border-radius:10px}
.btn{border:0;border-radius:10px;padding:12px 16px;font-weight:600;background:var(--brand);color:#fff}
.btn.sec{background:var(--brand-soft);color:var(--pts)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--fg)}
.btn.okb{background:var(--ok);color:#fff}
.btn.sm{padding:7px 11px;font-size:13px;border-radius:8px}
.btn:disabled{opacity:.45}
.full{width:100%}
label.f{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--muted);font-weight:500}
label.f input,label.f select,label.f textarea{width:100%;min-width:0;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--fg);font-size:15px}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.stack{display:flex;flex-direction:column;gap:10px}
.hstack{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.muted{color:var(--muted)}
.empty{text-align:center;color:var(--muted);padding:26px 10px}

/* stepper */
.step{display:flex;align-items:center;gap:6px}
.step button{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--surface);font-size:18px;font-weight:600}
.step input{width:46px;text-align:center;padding:6px 0;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-weight:600}
.prod.has{background:var(--brand-soft);margin:0 -14px;padding-inline:14px}

/* pay choice */
.choice{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.choice button{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 6px;font-weight:600;font-size:14px}
.choice button.on{border-color:var(--brand);background:var(--brand-soft);color:var(--pts)}
.choice2{grid-template-columns:1fr 1fr}

.total-bar{position:sticky;bottom:calc(76px + env(safe-area-inset-bottom,0px));background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;align-items:center;gap:12px;box-shadow:0 8px 24px rgba(10,20,60,.12)}
.total-bar .main{flex:1}
.total-bar b{font-family:var(--f-display);font-size:18px}

/* tab bar */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
nav.tabs .in{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);align-items:end}
nav.tabs button{background:none;border:0;padding:8px 0 10px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--muted);font-weight:500;position:relative}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button.on{color:var(--pts)}
nav.tabs button.sell .plus{width:52px;height:52px;border-radius:16px;background:#06279e;color:#fff;display:grid;place-items:center;margin-top:-22px;box-shadow:0 6px 16px rgba(6,39,158,.35)}
nav.tabs button .badge{top:2px;right:calc(50% - 22px)}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(8,12,30,.5);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:720px;max-height:92%;overflow:auto;border-radius:18px 18px 0 0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:4px auto 2px}
.sheet-head{display:flex;align-items:flex-start;gap:10px}
.sheet-head h2{flex:1;font-size:20px}
.close{background:var(--surface);border:1px solid var(--line);width:34px;height:34px;border-radius:9px;font-size:18px}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kv div{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.kv b{display:block;font-family:var(--f-display);font-size:16px}
.kv small{color:var(--muted);font-size:11.5px}
.phone{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.phone code{font-size:15px;font-weight:600;background:var(--surface);border:1px solid var(--line);padding:6px 10px;border-radius:8px;user-select:all}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom,0px));background:#141a33;color:#fff;padding:10px 16px;border-radius:10px;z-index:60;font-size:14px;max-width:calc(100% - 32px)}

/* alerts */
.alert{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line)}
.alert:first-child{border-top:0}
.alert .ic{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;flex:none}
.alert .ic svg{width:18px;height:18px}
.alert .main{flex:1;min-width:0}
.alert .main b{display:block;font-weight:600}
.alert .main small{color:var(--muted);font-size:12.5px}

/* setup */
.setup{min-height:100%;display:flex;flex-direction:column;justify-content:center;gap:16px;max-width:460px;margin:0 auto;padding-block:30px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.setup .brandmark{display:flex;align-items:center;gap:12px}

.setup h1{font-size:26px}
.vend-list{display:grid;gap:8px}
.vend-list button{display:flex;justify-content:space-between;align-items:center;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:14px 16px;font-weight:600;text-align:left}
.vend-list button small{color:var(--muted);font-weight:400}
.vend-list button.on{border-color:var(--brand);background:var(--brand-soft);color:var(--pts)}

/* ---------- Ordinateur / grand écran : menu à gauche, contenu sur 2 colonnes ---------- */
.layout2,.col-a,.col-b{display:flex;flex-direction:column;gap:14px;min-width:0}
.cards-grid{display:flex;flex-direction:column;gap:14px}
[data-device="laptop"] .top-row{max-width:none}
[data-device="laptop"] nav.tabs{top:calc(58px + env(safe-area-inset-top,0px));bottom:0;right:auto;width:232px;border-top:0;border-right:1px solid var(--line);padding:18px 12px;overflow-y:auto}
[data-device="laptop"] nav.tabs .in{display:flex;flex-direction:column;align-items:stretch;gap:4px;max-width:none}
[data-device="laptop"] nav.tabs button{flex-direction:row;justify-content:flex-start;gap:12px;padding:11px 12px;font-size:14.5px;border-radius:10px;color:var(--fg)}
[data-device="laptop"] nav.tabs button:hover{background:var(--bg)}
[data-device="laptop"] nav.tabs button.on{background:var(--brand-soft);color:var(--pts);font-weight:600}
[data-device="laptop"] nav.tabs button.sell{order:-1;background:#06279e;color:#fff;margin-bottom:12px;font-weight:600}
[data-device="laptop"] nav.tabs button.sell:hover{background:#0a32c4}
[data-device="laptop"] nav.tabs button.sell .plus{width:22px;height:22px;margin:0;box-shadow:none;background:none;border-radius:0}
[data-device="laptop"] nav.tabs button .badge{position:static;margin-left:auto}
[data-device="laptop"] main#view{margin:0 0 0 232px;max-width:1240px;padding:24px 32px 48px}
[data-device="laptop"] main#dview{max-width:1280px;padding:24px 32px 48px}
[data-device="laptop"] .layout2{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:20px;align-items:start}
[data-device="laptop"] .layout2.sell .col-b{position:sticky;top:calc(80px + env(safe-area-inset-top,0px))}
[data-device="laptop"] .total-bar{position:static;box-shadow:none}
[data-device="laptop"] .cards-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:16px;align-items:start}
[data-device="laptop"] .scrim{align-items:center}
[data-device="laptop"] .sheet{max-width:640px;max-height:88%;border-radius:18px;padding-block:8px 24px}
[data-device="laptop"] .grab{display:none}
[data-device="laptop"] .toast{bottom:28px}
[data-device="laptop"] .hero .big{font-size:52px}
[data-device="laptop"] .row.tap:hover{background:var(--bg);margin:0 -14px;padding-inline:14px}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .22s ease-out}@keyframes up{from{transform:translateY(30px);opacity:.6}}}
@media (max-width:380px){.hero .big{font-size:38px}.kv,.hero-grid{grid-template-columns:1fr 1fr}}
</style>

<script>
"use strict";

/* ---------- type d'appareil : téléphone ou ordinateur ---------- */
const BIG=window.matchMedia?matchMedia('(min-width: 900px)'):{matches:false};
function setDevice(){document.documentElement.dataset.device=BIG.matches?'laptop':'phone'}
setDevice();
try{BIG.addEventListener('change',()=>{setDevice();if(typeof render==='function')render()})}catch(e){}
/* ---------- PIN gardé haché sur le téléphone (pour réafficher le salaire, même sans internet) ---------- */
async function hashPin(pin,salt){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(salt+':'+pin));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
async function rememberPin(pin){try{const salt=[...crypto.getRandomValues(new Uint8Array(8))].map(x=>x.toString(16).padStart(2,'0')).join('');S.pinSalt=salt;S.pinHash=await hashPin(pin,salt);save()}catch(e){}}
/* ---------- GPS : position des clients et tournée (le GPS marche sans internet) ---------- */
const CAP=[19.757,-72.204];
let lastFix=null,tourWatch=null,wakeLock=null;
function getPos(){return new Promise((res,rej)=>{if(!navigator.geolocation)return rej(new Error('GPS non disponible sur cet appareil'));
  navigator.geolocation.getCurrentPosition(p=>{lastFix=[+p.coords.latitude.toFixed(6),+p.coords.longitude.toFixed(6),Date.now(),Math.round(p.coords.accuracy)];res(lastFix)},
  e=>rej(new Error(e.code===1?'Autorise la localisation pour Elite Ventes dans les réglages du navigateur':'Position introuvable : réessaie dehors, loin des murs')),{enableHighAccuracy:true,timeout:25000,maximumAge:20000})})}
const recentFix=()=>lastFix&&Date.now()-lastFix[2]<5*60e3?[lastFix[0],lastFix[1],lastFix[3]]:undefined;
function distKm(a,b){const R=6371,r=x=>x*Math.PI/180,dl=r(b[0]-a[0]),dn=r(b[1]-a[1]),h=Math.sin(dl/2)**2+Math.cos(r(a[0]))*Math.cos(r(b[0]))*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(h))}
const trackKm=pts=>pts.reduce((s,p,i)=>i?s+distKm(pts[i-1],p):0,0);
function flushTour(force){if(!S||!S.tourOut||!S.tourOut.length)return;if(!force&&S.tourOut.length<20)return;const pts=S.tourOut.splice(0);op('tournee.points',{date:pts[0][4]||today(),pts:pts.map(p=>p.slice(0,4))})}
function onTourFix(p){if(!S||!S.tour||!S.tour.active)return;const f=[+p.coords.latitude.toFixed(6),+p.coords.longitude.toFixed(6),Date.now(),Math.round(p.coords.accuracy)];lastFix=f;
  if(f[3]>120)return;const last=S.tour.pts[S.tour.pts.length-1];
  if(last&&distKm(last,f)<0.025&&f[2]-last[2]<120e3)return;
  S.tour.pts.push(f);S.tourOut.push([...f,today()]);save();flushTour(false);
  if(tab==='home'&&document.getElementById('tourinfo'))document.getElementById('tourinfo').innerHTML=tourInfo();}
function startWatch(){if(tourWatch!=null||!navigator.geolocation)return;tourWatch=navigator.geolocation.watchPosition(onTourFix,e=>{if(e.code===1){toast('Autorise la localisation pour enregistrer la tournée');}},{enableHighAccuracy:true,maximumAge:10000,timeout:60000})}
function stopWatch(){if(tourWatch!=null){navigator.geolocation.clearWatch(tourWatch);tourWatch=null}try{wakeLock&&wakeLock.release()}catch(e){}wakeLock=null}

/* ---------- CRM : analyse client ---------- */
function clientInfo(c){
  const os=S.orders.filter(o=>o.cid===c.id&&o.status!=='annulee').sort((a,b)=>a.date<b.date?-1:1);
  const dates=[...new Set(os.map(o=>o.date))];
  const last=dates[dates.length-1]||null;
  let freq=null;
  if(dates.length>=2){const gaps=[];for(let i=1;i<dates.length;i++)gaps.push(days(dates[i-1],dates[i]));
    gaps.sort((a,b)=>a-b);freq=Math.max(5,gaps[Math.floor(gaps.length/2)]);}
  const since=last?days(last,today()):null;
  const credit=os.filter(o=>o.pay==='credit'&&!o.paidAt).reduce((s,o)=>s+orderAmt(o),0);
  const basket={};os.forEach(o=>o.lines.forEach(l=>basket[l.pid]=(basket[l.pid]||0)+l.qty));
  const top=Object.entries(basket).sort((a,b)=>b[1]-a[1]).slice(0,4);
  const cases=os.reduce((s,o)=>s+orderCases(o),0);
  const pts=os.reduce((s,o)=>s+(ptsState(o)==='valide'?orderPts(o):0),0);
  const lastLog=c.logs&&c.logs.length?c.logs[c.logs.length-1]:null;
  return {os,last,freq,since,credit,top,cases,pts,lastLog,n:dates.length};
}
// Génère toutes les alertes du vendeur
function alerts(){
  const t=today(),A=[];
  S.clients.forEach(c=>{
    const k=clientInfo(c);
    const contacted=k.lastLog?days(k.lastLog.date,t):999;
    if(c.next&&c.next<=t){A.push({kind:'relance',lvl:'warn',cid:c.id,title:c.name,text:'Relance prévue '+(c.next===t?"aujourd'hui":'depuis le '+dShort(c.next)),sort:1});return}
    if(k.last&&k.freq&&contacted>2){
      const ratio=k.since/k.freq;
      if(ratio>=0.85&&ratio<2){A.push({kind:'stock',lvl:ratio>=1.2?'bad':'warn',cid:c.id,title:c.name,text:'Stock probablement terminé : achète tous les ~'+k.freq+' j, dernière commande '+ago(k.since),sort:ratio>=1.2?0:2});return}
      if(ratio>=2){A.push({kind:'relance',lvl:'bad',cid:c.id,title:c.name,text:'Client inactif : aucune commande depuis '+k.since+' j (habitude : '+k.freq+' j)',sort:3});return}
    }
    if(k.last&&!k.freq&&k.since>=30&&contacted>7){A.push({kind:'relance',lvl:'warn',cid:c.id,title:c.name,text:'Une seule commande, '+ago(k.since)+'. À relancer pour une 2e commande',sort:4});return}
    if(c.status==='prospect'&&contacted>7){A.push({kind:'relance',lvl:'info',cid:c.id,title:c.name,text:'Prospect'+(c.note?' · '+c.note:'')+(k.lastLog?' · dernier contact '+ago(contacted):' · jamais contacté dans l\'app'),sort:6})}
  });
  S.orders.filter(o=>o.refusedAt&&!o.paidAt&&o.status!=='annulee').forEach(o=>A.push({kind:'credit',lvl:'bad',oid:o.id,cid:o.cid,title:(C(o.cid)||{}).name||'Client',text:'Paiement refusé par la caisse le '+dShort(o.refusedAt)+' · '+fmt(orderAmt(o))+' HTG à régler',sort:0.1}));
  S.orders.filter(o=>o.status==='attente').forEach(o=>A.push({kind:'commande',lvl:'warn',oid:o.id,cid:o.cid,title:(C(o.cid)||{}).name||'Client',text:'Commande en attente de livraison · '+fq(orderCases(o))+' caisses · '+dShort(o.date),sort:0.5}));
  S.orders.filter(o=>o.pay==='credit'&&!o.paidAt&&o.status!=='annulee').forEach(o=>{
    const d=days(o.date,t),left=DELAI-d;
    if(left<=4&&left>=0)A.push({kind:'credit',lvl:'bad',oid:o.id,cid:o.cid,title:(C(o.cid)||{}).name||'Client',text:fmt(orderAmt(o))+' HTG à encaisser · '+(left===0?"dernier jour":left+' j restants')+' pour garder '+fp(orderPts(o))+' pts',sort:0.2});
  });
  return A.sort((a,b)=>a.sort-b.sort);
}

// Récupère la grille des points et les objectifs publiés par la Direction
async function pullConfig(force){
  if(!S||!navigator.onLine||!S.sync.url||!S.sync.key)return;
  if(!force&&S.sync.pulled&&Date.now()-S.sync.pulled<5*60e3)return;
  try{
    const base=S.sync.url.replace(/\/$/,'')+'/rest/v1/',h=srvHeaders(S.sync.key);
    const tmo=(pr)=>Promise.race([pr,new Promise((_,rj)=>setTimeout(()=>rj(new Error('timeout')),8000))]);
    const [g,o,rm,pp]=await tmo(Promise.all([fetch(base+'grille?select=id,name,pts,price,combo,stock,reserve,engage,sort,categorie&order=sort',{headers:h}),fetch(base+'objectifs?select=ym,points,cible_rapide,cible_moyenne,cible_lente',{headers:h}),fetch(base+'remuneration?select=fixe,taux,taux_accel,garantie,garantie_jusqu_a',{headers:h}),fetch(base+'parametres_publics?select=tel_caisse,nom_caisse,visites_jour',{headers:h})]));
    if(!g.ok||!o.ok)return;
    const rows=await g.json(),objs=await o.json();
    if(Array.isArray(rows)&&rows.length){
      const act=new Set(rows.map(r=>r.id));
      rows.forEach(r=>{const p=S.products.find(x=>x.id===r.id);const v={id:r.id,name:r.name,pts:+r.pts,price:+r.price,combo:+r.combo,stock:+r.stock,reserve:+r.reserve||0,engage:+r.engage||0,sort:+r.sort,categorie:r.categorie,active:true};if(p)Object.assign(p,v);else S.products.push(v)});
      S.products.forEach(p=>{if(!act.has(p.id))p.active=false});
    }
    if(Array.isArray(objs))objs.forEach(x=>{S.objectives[x.ym]=+x.points;(S.cibles=S.cibles||{})[x.ym]={rapide:+x.cible_rapide||0,moyenne:+x.cible_moyenne||0,lente:+x.cible_lente||0}});
    try{if(rm&&rm.ok){const x=await rm.json();if(x&&x[0])S.remu=x[0]}}catch(e){}
    try{if(pp&&pp.ok){const x=await pp.json();if(x&&x[0])S.params=x[0]}}catch(e){}
    S.sync.pulled=Date.now();S.sync.stockAt=Date.now();save();if(document.getElementById('view')&&!document.getElementById('scrim'))renderView();
  }catch(e){}
}
// Confirmations / refus de paiement faits par la caisse (Gesmane)
let pullingDec=false;
async function pullDecisions(force){
  if(!S||!S.token||pullingDec||!navigator.onLine)return;
  if(!force&&S.sync.decAt&&Date.now()-S.sync.decAt<90e3)return;
  pullingDec=true;
  try{
    const r=await fetch(SERVER_URL+'/functions/v1/vendeur-sync',{method:'POST',headers:{'Content-Type':'application/json','apikey':SERVER_KEY},body:JSON.stringify({token:S.token})});
    const j=await r.json().catch(()=>({}));
    if(r.status===401){S.sync.sessionErr=j.error||'Session expirée';save();renderTop();pullingDec=false;return}
    if(r.ok&&Array.isArray(j.decisions)){
      S.seenDec=S.seenDec||{};let nC=0,nR=0;
      j.decisions.forEach(d=>{const k=d.id+'|'+d.statut+'|'+d.at;if(S.seenDec[k])return;S.seenDec[k]=1;const o=S.orders.find(x=>x.id===d.id);if(!o)return;
        if(d.statut==='confirme'){o.confirmedAt=d.at;o.refusedAt=null;nC++}else{o.paidAt=null;o.confirmedAt=null;o.refusedAt=d.at;nR++}});
      S.sync.decAt=Date.now();S.sync.sessionErr=null;save();
      if(nC||nR){if(document.getElementById('view'))renderView();toast([nC?nC+' paiement(s) confirmé(s) par la caisse':'',nR?nR+' refusé(s)':''].filter(Boolean).join(' · '))}
    }
  }catch(e){}
  pullingDec=false;
}
async function trySync(){
  pullConfig(false);pullDecisions(false);
  if(syncing||!navigator.onLine||!S||!S.sync.url||!S.sync.key||!S.outbox.length)return;
  syncing=true;
  try{
    const batch=S.outbox.slice(0,200);
    const res=await fetch(S.sync.url.replace(/\/$/,'')+'/rest/v1/operations',{method:'POST',
      headers:{...srvHeaders(S.sync.key),'Prefer':'resolution=ignore-duplicates,return=minimal'},
      body:JSON.stringify(batch.map(b=>({id:b.id,vendor:b.vendor,type:b.type,payload:b.payload,created_at:b.at})))});
    if(res.ok){const ids=new Set(batch.map(b=>b.id));S.outbox=S.outbox.filter(b=>!ids.has(b.id));S.sync.last=new Date().toISOString();S.sync.err=null;save();if(batch.some(b=>b.type.startsWith('vente.')))setTimeout(()=>pullConfig(true),800)}
    else{S.sync.err='Erreur serveur '+res.status;save()}
  }catch(e){S.sync.err='Serveur injoignable';save()}
  syncing=false;renderTop();
  if(S.outbox.length&&!S.sync.err)setTimeout(trySync,500);
}

/* ---------- Ma performance : jour par jour, semaine, mois ---------- */
function dayStats(d){const r={v:0,a:0,cases:0,amt:0,cl:new Set()};S.orders.forEach(o=>{if(o.date!==d||o.status==='annulee')return;const st=ptsState(o),p2=orderPts(o);if(st==='valide')r.v+=p2;else if(st==='attente'||st==='aconfirmer')r.a+=p2;r.cases+=orderCases(o);r.amt+=orderAmt(o);r.cl.add(o.cid)});r.pts=r.v+r.a;return r}
function monthPerf(ym2){const os=S.orders.filter(o=>o.date.slice(0,7)===ym2&&o.status!=='annulee');const r={v:0,cases:0,cR:0,cM:0,cL:0,amt:0,cl:new Set(),elig:0,ok:0};
  os.forEach(o=>{const st=ptsState(o);if(st==='valide'){r.v+=orderPts(o);r.cl.add(o.cid)}r.cases+=orderCases(o);r.amt+=orderAmt(o);o.lines.forEach(l=>{const c=P(l.pid).categorie||'moyenne';r['c'+(c==='rapide'?'R':c==='lente'?'L':'M')]+=l.qty});
    if(o.paidAt||days(o.date,today())>DELAI){r.elig++;if(st==='valide')r.ok++}});r.pct14=r.elig?r.ok/r.elig*100:null;return r}
function trend(cur,prev,unit){if(prev==null)return '';const d=cur-prev;if(Math.abs(d)<0.01)return '<small class="muted">= pareil</small>';return `<small style="color:var(${d>0?'--ok':'--bad'});font-weight:600">${d>0?'▲ +':'▼ '}${unit==='HTG'?fmt(d):fp(d)}</small>`}
function perfView(){
  const t=today(),obj=objective(t.slice(0,7)),perDay=Math.round(obj/26),cur=t.slice(0,7);
  const D0=dayStats(t),D1=dayStats(addDays(t,-1)),D7=dayStats(addDays(t,-7));

  // 14 derniers jours
  const ds=[...Array(14)].map((_,i)=>addDays(t,i-13)).map(d=>({d,...dayStats(d)}));
  const mx=Math.max(perDay*1.4,...ds.map(x=>x.pts))||1,W=560,H=170,pl=34,pb=26,pt=10,bw=(W-pl-8)/14,y=v=>pt+(H-pt-pb)*(1-v/mx);
  const ticks=[0,Math.round(mx/2),Math.round(mx)];
  const bars=ds.map((x,i)=>{const X=pl+i*bw+2,w=bw-4,hv=(H-pt-pb)*x.v/mx,ha=(H-pt-pb)*x.a/mx,base=H-pb,dd=parse(x.d),lab=dd.getDate(),wk=dd.getDay();
    return `<g><title>${dShort(x.d)} : ${fp(x.v)} pts validés${x.a?' + '+fp(x.a)+' en attente':''} · ${fq(x.cases)} caisses</title>
      ${x.v?`<rect x="${X}" y="${base-hv}" width="${w}" height="${Math.max(0,hv-1)}" rx="3" fill="var(--brand)"></rect>`:''}
      ${x.a?`<rect x="${X}" y="${base-hv-ha}" width="${w}" height="${Math.max(0,ha-2)}" rx="3" fill="var(--brand)" fill-opacity=".35"></rect>`:''}
      <rect x="${X-1}" y="${pt}" width="${w+2}" height="${H-pt-pb}" fill="transparent"></rect>
      <text x="${X+w/2}" y="${H-8}" text-anchor="middle" font-size="10.5" fill="var(${x.d===t?'--fg':'--muted'})" font-weight="${x.d===t?700:400}">${wk===0?'D':lab}</text></g>`}).join('');
  const chart=`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Points par jour sur 14 jours" style="display:block;max-width:100%">
    ${ticks.map(v=>`<line x1="${pl}" x2="${W-6}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"></line><text x="${pl-6}" y="${y(v)+3.5}" text-anchor="end" font-size="10" fill="var(--muted)">${v}</text>`).join('')}
    ${bars}
    <line x1="${pl}" x2="${W-6}" y1="${y(perDay)}" y2="${y(perDay)}" stroke="var(--ok)" stroke-width="2" stroke-dasharray="5 4"></line>
</svg>`;
  const green=ds.filter(x=>x.pts>=perDay).length;let streak=0;for(let i=ds.length-1;i>=0;i--){if(ds[i].pts>=perDay)streak++;else if(ds[i].d!==t)break}
  // semaines du mois
  const [Y,Mo]=cur.split('-').map(Number),dim=new Date(Y,Mo,0).getDate(),wk=[];for(let s0=1;s0<=dim;s0+=7){const e=Math.min(dim,s0+6),tgt=Math.round(obj*(e-s0+1)/dim);let v=0,a=0;for(let d=s0;d<=e;d++){const x=dayStats(cur+'-'+String(d).padStart(2,'0'));v+=x.v;a+=x.a}wk.push({s0,e,tgt,v,a})}
  const dayN=new Date().getDate();
  // mois en cours vs mois passé à la même date
  const pm=prevYm(cur),sameDay=pm+'-'+String(Math.min(dayN,new Date(Y,Mo-1,0).getDate())).padStart(2,'0');
  const toDate=(m0,last)=>{let v=0,c=0;const cl=new Set();S.orders.forEach(o=>{if(o.date.slice(0,7)!==m0||o.date>last||o.status==='annulee')return;if(ptsState(o)==='valide'){v+=orderPts(o);cl.add(o.cid)}c+=orderCases(o)});return {v,c,cl:cl.size}};
  const nowM=toDate(cur,t),prevM=toDate(pm,sameDay);
  // historique mensuel
  const months=[...new Set(S.orders.map(o=>o.date.slice(0,7)))].sort().reverse().slice(0,6);
  const td='style="padding:6px 5px;text-align:center;white-space:nowrap"';
  return `<section class="card stack"><b>Aujourd'hui, comparé à hier</b>
    <div class="kv" style="grid-template-columns:repeat(auto-fit,minmax(140px,1fr))">${tile('Points',x=>x.pts)}${tile('Caisses',x=>x.cases)}${tile('Ventes (HTG)',x=>x.amt,'HTG')}${tile('Clients servis',x=>x.cl.size)}</div>
    <small class="muted">Points du jour = validés + en attente de paiement ou de confirmation.</small></section>
  <div class="layout2"><div class="col-a">
  <section class="card stack"><div class="hstack" style="justify-content:space-between"><b>14 derniers jours</b><span class="hstack" style="gap:10px"><span class="lg"><i style="background:var(--brand)"></i>validés</span><span class="lg"><i style="background:var(--brand);opacity:.35"></i>en attente</span><span class="lg"><i style="background:none;border-top:2px dashed var(--ok);border-radius:0;height:0;width:14px"></i>objectif ${perDay} pts/jour</span></span></div>
    ${chart}
    <div class="hstack" style="gap:8px"><span class="chip ${green>=10?'c-ok':green>=6?'c-warn':'c-bad'}">${green} jour(s) sur 14 à l'objectif</span>${streak?`<span class="chip c-ok">Série en cours : ${streak} jour(s)</span>`:''}</div>
    <details><summary class="muted" style="font-size:12.5px;cursor:pointer">Voir les chiffres</summary><div class="rows">${ds.slice().reverse().map(x=>`<div class="row"><div class="main">${dShort(x.d)}</div><div class="end num">${fp(x.pts)} pts · ${fq(x.cases)} caisses</div></div>`).join('')}</div></details></section>
  <section class="card stack"><b>Semaines de ${MOIS[Mo-1]}</b><div class="rows">${wk.map((w,i)=>{const pc=Math.min(100,(w.v+w.a)/Math.max(1,w.tgt)*100),past=w.e<dayN,curW=dayN>=w.s0&&dayN<=w.e;return `<div class="row"><div class="main"><b>Semaine ${i+1} <small class="muted" style="font-weight:400">(${w.s0}-${w.e})</small>${curW?' <span class="chip c-info" style="font-size:10.5px">en cours</span>':''}</b><div class="mini-bar"><span class="${pc>=100?'done':''}" style="width:${pc}%"></span></div></div><div class="end num"><b>${fp(w.v+w.a)}</b> <small class="muted">/ ${w.tgt}</small>${past?`<div>${w.v+w.a>=w.tgt?'<span class="chip c-ok" style="font-size:10.5px">atteint</span>':'<span class="chip c-bad" style="font-size:10.5px">manqué</span>'}</div>`:''}</div></div>`}).join('')}</div></section>
  </div><div class="col-b">
  <section class="card stack"><b>${MOIS[Mo-1][0].toUpperCase()+MOIS[Mo-1].slice(1)} contre ${MOIS[+pm.slice(5)-1]}, à la même date</b>
    <div class="kv"><div><b class="num">${fp(nowM.v)}</b><small>pts validés (${fp(prevM.v)})</small><span style="display:block">${trend(nowM.v,prevM.v)}</span></div><div><b class="num">${fq(nowM.c)}</b><small>caisses (${fq(prevM.c)})</small><span style="display:block">${trend(nowM.c,prevM.c)}</span></div><div><b class="num">${nowM.cl}</b><small>clients payés (${prevM.cl})</small><span style="display:block">${trend(nowM.cl,prevM.cl)}</span></div></div>

function homeDay(){

    <div class="month-nav"><span class="lbl">Points ${MOIS[m-1]} ${y}</span><span class="hstack"><button data-act="mprev" aria-label="Mois précédent">‹</button><button data-act="mnext" aria-label="Mois suivant" ${isCur?'disabled':''}>›</button></span></div>

}

function salaryCard(st,obj){
  const sal=salaire(S.remu,ym,st.valide,obj,false),R=sal.R,isCur=ym===today().slice(0,7);
  const ifConf=st.aconf?salaire(S.remu,ym,st.valide+st.aconf,obj,false).total:0;
  const notice=!S.token||S.sync.sessionErr?`<div class="hstack" style="justify-content:space-between;background:var(--warn-soft);border-radius:10px;padding:8px 10px"><small style="color:var(--warn)">Entre ton PIN une fois pour recevoir les paiements confirmés par la caisse.</small><button class="btn sm" data-act="askrelogin">Entrer mon PIN</button></div>`:'';
  const ui=S.salUI||'open',tb=(a,l)=>`<button class="btn sm ghost" data-act="${a}">${l}</button>`;

function csvText(){
  const rows=[['Auto Parts','Date Livraison','Vendeur','Article','Quantite','Statut Commande','Mode paiement','Statut Paiment','Prix Vente','Total Vente','Points']];
  S.orders.filter(o=>o.src!=='hist').forEach(o=>o.lines.forEach(l=>rows.push([(C(o.cid)||{}).name||'',o.date,S.vendor,P(l.pid).name,l.qty,o.status==='attente'?'Attente':'Confirmé',{cash:'Cash',moncash:'MonCash',credit:'Crédit'}[o.pay],o.paidAt?'Payé':'',l.price,l.qty*l.price,l.qty*(l.pts??P(l.pid).pts)])));
  return rows.map(r=>r.map(x=>/[;"\n]/.test(String(x))?'"'+String(x).replace(/"/g,'""')+'"':x).join(';')).join('\n');

function openSheet(html){closeSheet();const d=document.createElement('div');d.className='scrim';d.id='scrim';d.innerHTML=`<div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div>${html}</div>`;document.body.appendChild(d)}
function closeSheet(){const s=$('#scrim');s&&s.remove()}
function salPinSheet(){
  openSheet(`<div class="sheet-head"><h2>Afficher mon salaire</h2><button class="close" data-act="close" aria-label="Fermer">×</button></div>
  <div class="card stack"><label class="f">PIN de ${esc(S.vendor)}<input id="spin" type="password" inputmode="numeric" autocomplete="off" maxlength="8"></label>
  <button class="btn" data-act="salpin">Afficher</button><div id="smsg"></div></div>`);

}
async function checkPin(pin){
  if(S.pinHash&&S.pinSalt&&await hashPin(pin,S.pinSalt)===S.pinHash)return true;
  if(!navigator.onLine)return S.pinHash?false:null;
  // PIN changé par la Direction, ou téléphone sans PIN gardé : vérification par le serveur
  const r=await fetch(SERVER_URL+'/functions/v1/portefeuille',{method:'POST',headers:{'Content-Type':'application/json','apikey':SERVER_KEY},body:JSON.stringify({vendor:S.vendor,pin})});
  if(r.ok){const j=await r.json().catch(()=>({}));if(j.token)S.token=j.token;await rememberPin(pin);return true}
  if(r.status===429)throw new Error("Trop d'essais. Réessaie dans 15 minutes.");
  return false;
}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  if(e.target.id==='scrim'){closeSheet();return}
  const t=e.target.closest('[data-act],[data-tab]');if(!t)return;
  if(t.tagName==='A'&&t.getAttribute('href')==='#')e.preventDefault();
  if(t.dataset.tab){tab=t.dataset.tab;closeSheet();renderView();scrollTo(0,0);return}
  const a=t.dataset.act,id=t.dataset.id;
  switch(a){
    case 'pick':setup.pick=t.dataset.v;setup.err=null;render();setTimeout(()=>{const i=$('#pin');i&&i.focus()},50);break;
    case 'login':login();break;
    case 'retryv':setup.err=null;setup.vendors=null;render();break;
    case 'settings':settingsSheet();break;
    case 'close':closeSheet();break;
    case 'homev':homeV=t.dataset.v;renderView();scrollTo(0,0);break;
    case 'mprev':{const [y,m]=ym.split('-').map(Number);const d=new Date(y,m-2,1);ym=iso(d).slice(0,7);renderView();break}
    case 'mnext':{const [y,m]=ym.split('-').map(Number);const d=new Date(y,m,1);ym=iso(d).slice(0,7);renderView();break}
    case 'vplan':{const k=today();S.visitsPlanned[k]=Math.max(0,(S.visitsPlanned[k]||0)+Number(t.dataset.d));save();renderView();break}
    case 'cf':cFilter=t.dataset.f;renderView();break;
    case 'of':oFilter=t.dataset.f;renderView();break;
    case 'client':clientSheet(id||t.dataset.cid);break;
    case 'gorder':oFilter=id==='credit'?'credit':'attente';tab='orders';renderView();break;
    case 'sellto':cart=newCart(id);tab='sell';closeSheet();renderView();scrollTo(0,0);break;
    case 'pickclient':pickClientSheet();break;
    case 'pickc':cart.cid=id;closeSheet();renderView();break;
    case 'addq':{const a=avail(id),nq=Math.max(0,(cart.q[id]||0)+Number(t.dataset.d));if(nq>a){toast('Seulement '+fq(a)+' caisse(s) disponible(s) pour '+P(id).name);cart.q[id]=Math.min(cart.q[id]||0,a)}else cart.q[id]=nq;renderView();break}
    case 'pay':cart.pay=t.dataset.v;renderView();break;
    case 'deliv':cart.deliv=t.dataset.v;renderView();break;
    case 'savesale':{if(!cart||!cart.cid||!Object.values(cart.q).some(q=>q>0))return;
      if(navigator.onLine){t.disabled=true;toast('Vérification du stock…');cart.offline=null;pullConfig(true).catch(()=>{}).finally(()=>runAct('savesale_go'))}
      else offlineSaleSheet();break}
    case 'offnet':if(navigator.onLine){closeSheet();runAct('savesale')}else $('#offmsg').innerHTML='<span style="color:var(--bad)">Toujours pas de connexion internet.</span>';break;
    case 'offok':{if(!$('#offconf').checked){$('#offmsg').innerHTML='<span style="color:var(--bad)">Coche la case quand la caisse a confirmé le stock.</span>';return}
      const nom=(S.params&&S.params.nom_caisse)||'Gesmane';cart.offline={mode:'appel',avec:nom,stockAt:S.sync.stockAt?new Date(S.sync.stockAt).toISOString():null,note:($('#offnote').value||'').trim()};closeSheet();runAct('savesale_go');break}
    case 'savesale_go':{
      const lines=Object.entries(cart.q).filter(([,q])=>q>0).map(([pid,qty])=>({pid,qty,price:P(pid).price,pts:P(pid).pts}));
      if(!cart.cid||!lines.length)return;
      const over=lines.find(l=>l.qty>avail(l.pid));if(over){lines.forEach(l=>{if(l.qty>avail(l.pid))cart.q[l.pid]=Math.floor(avail(l.pid)*2)/2});toast('Le stock a changé : '+P(over.pid).name+' n\'a plus que '+fq(avail(over.pid))+' caisse(s). Quantité ajustée, vérifie et enregistre.');renderView();return}
      const date=$('#cdate').value||today();
      const o={id:uid(),cid:cart.cid,vend:S.vendor,date,pay:cart.pay,lines,status:cart.deliv,paidAt:cart.pay==='credit'?null:date,note:($('#cnote').value||'').trim(),cname:(C(cart.cid)||{}).name||'',src:'app',createdAt:new Date().toISOString(),gps:recentFix(),offline:cart.offline||undefined};
      S.orders.push(o);const c=C(cart.cid);if(c.status==='prospect'){c.status='client';op('client.update',{id:c.id,status:'client'})}
      op('vente.creee',o);
      const pts=orderPts(o);cart=null;
      toast(o.pay==='credit'?`Vente enregistrée · ${fp(pts)} pts en attente de paiement`:`Vente enregistrée · ${fp(pts)} pts dès que la caisse confirme`);
      tab=o.status==='attente'?'orders':'home';if(tab==='orders')oFilter='attente';renderView();scrollTo(0,0);break}
    case 'deliver':{const o=S.orders.find(x=>x.id===id);o.status='livree';o.deliveredAt=today();op('vente.livree',{id,at:o.deliveredAt});toast('Commande marquée livrée');renderView();break}
    case 'paid':{const o=S.orders.find(x=>x.id===id);o.paidAt=today();op('vente.payee',{id,at:o.paidAt});const st=ptsState(o);toast(st==='aconfirmer'?`Paiement envoyé à la caisse · ${fp(orderPts(o))} pts après confirmation`:st==='valide'?`Payé · +${fp(orderPts(o))} pts validés`:'Payé · après 14 jours, pas de points');renderView();break}
    case 'ltype':document.querySelectorAll('#ltype button').forEach(b=>b.classList.toggle('on',b===t));break;
    case 'addlog':{const c=C(id);const type=(document.querySelector('#ltype .on')||{}).dataset?.t||'Visite';
      const l={date:today(),type,note:$('#lnote').value.trim(),gps:recentFix()};c.logs=c.logs||[];c.logs.push(l);c.next=$('#lnext').value||null;
      op('client.suivi',{cid:id,...l,next:c.next});toast('Suivi enregistré');clientSheet(id);if(tab!=='sell')renderView();break}
    case 'newclient':newClientSheet();break;
    case 'askrelogin':reloginSheet();break;
    case 'cgps':{const c=C(id),m2=$('#gpsmsg');if(m2)m2.innerHTML='<small class="muted">Recherche de la position…</small>';
      getPos().then(f=>{c.lat=f[0];c.lng=f[1];c.acc=f[3];c.gpsAt=new Date().toISOString();save();op('client.update',{id:c.id,lat:c.lat,lng:c.lng,acc:c.acc,gpsAt:c.gpsAt});
        toast(f[3]>100?'Position enregistrée, mais peu précise (±'+f[3]+' m) : refais-la dehors':'Position enregistrée (±'+f[3]+' m)');clientSheet(id)})
      .catch(e=>{if(m2)m2.innerHTML='<small style="color:var(--bad)">'+esc(e.message)+'</small>'});break}
    case 'cmap':{const c=C(id);closeSheet();tab='clients';cView='map';MAPview=[{lat:c.lat,lng:c.lng},17,'map'];renderView();break}
    case 'cview':cView=t.dataset.v;renderView();break;
    case 'mf':mapF[t.dataset.f]=!mapF[t.dataset.f];renderView();break;
    case 'mylocation':getPos().then(f=>{if(MAP){MAP.setView([f[0],f[1]],16);L.circleMarker([f[0],f[1]],{radius:7,color:'#fff',weight:2,fillColor:'#1a73e8',fillOpacity:1}).addTo(MAP)}}).catch(e=>toast(e.message));break;
    case 'tourstart':S.tour={active:true,date:today(),start:Date.now(),pts:[],awake:false};save();startWatch();getPos().then(f=>onTourFix({coords:{latitude:f[0],longitude:f[1],accuracy:f[3]}})).catch(e=>toast(e.message));renderView();toast('Tournée démarrée : garde l\'app ouverte');break;
    case 'tourstop':{flushTour(true);const km=trackKm(S.tour.pts);(S.tours=S.tours||{})[S.tour.date]=S.tour.pts.map(p=>p.slice(0,3));S.tour.active=false;save();stopWatch();toast('Tournée terminée · '+km.toFixed(1).replace('.',',')+' km');renderView();break}
    case 'tourawake':S.tour.awake=t.checked;save();keepAwake(t.checked);break;
    case 'salfold':S.salUI='folded';save();renderView();break;
    case 'salopen':S.salUI='open';save();renderView();break;
    case 'salmask':S.salUI='masked';save();renderView();toast('Salaire masqué');break;
    case 'salshow':salPinSheet();break;
    case 'salpin':{const pin=($('#spin').value||'').trim();if(!pin)return;$('#smsg').innerHTML='<span class="muted">Vérification…</span>';
      checkPin(pin).then(ok=>{if(ok){S.salUI='open';save();closeSheet();renderView()}else $('#smsg').innerHTML='<span style="color:var(--bad)">'+(ok===null?'Connecte-toi à internet une fois pour vérifier ton PIN':'PIN incorrect')+'</span>'})
      .catch(e=>{$('#smsg').innerHTML='<span style="color:var(--bad)">'+esc(e.message)+'</span>'});break}
    case 'relogin':{const pin=($('#rpin').value||'').trim();if(!pin)return;$('#rmsg').innerHTML='<span class="muted">Vérification…</span>';
      fetch(SERVER_URL+'/functions/v1/portefeuille',{method:'POST',headers:{'Content-Type':'application/json','apikey':SERVER_KEY},body:JSON.stringify({vendor:S.vendor,pin})})
      .then(r=>r.json().then(j=>({ok:r.ok,j}))).then(({ok,j})=>{if(!ok)throw new Error(j.error||'Erreur');rememberPin(pin);S.token=j.token;S.sync.sessionErr=null;S.seenDec={};save();closeSheet();toast('Session ouverte');pullDecisions(true);renderView()})
      .catch(e=>{$('#rmsg').innerHTML='<span style="color:var(--bad)">'+esc(navigator.onLine?e.message:'Pas de connexion internet')+'</span>'});break}
    case 'savenew':{const name=$('#nname').value.trim();if(!name){toast('Le nom est obligatoire');return}
      const c={id:'c_'+uid(),name,phone:$('#nphone').value.trim(),zone:$('#nzone').value.trim(),vend:S.vendor,note:'',status:$('#nstat').value,logs:[],next:null};
      const wantGps=$('#ngps')&&$('#ngps').checked;
      S.clients.push(c);op('client.cree',c);closeSheet();toast('Client ajouté');
      if(wantGps)getPos().then(f=>{c.lat=f[0];c.lng=f[1];c.acc=f[3];c.gpsAt=new Date().toISOString();save();op('client.update',{id:c.id,lat:c.lat,lng:c.lng,acc:c.acc,gpsAt:c.gpsAt});toast('Position GPS enregistrée (±'+c.acc+' m)')}).catch(e=>toast(e.message));
      if(tab==='sell'){cart.cid=c.id}renderView();break}
    case 'savesync':S.sync.url=$('#surl').value.trim()||SERVER_URL;S.sync.key=$('#skey').value.trim()||SERVER_KEY;S.sync.err=null;S.sync.pulled=0;save();trySync();toast(navigator.onLine?'Envoi en cours':'Enregistré. Envoi au retour du réseau');settingsSheet();break;
    case 'csv':{try{const b=new Blob(['﻿'+csvText()],{type:'text/csv'});const u=URL.createObjectURL(b);const l=document.createElement('a');l.href=u;l.download='ventes-'+S.vendor+'-'+today()+'.csv';document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),2000)}catch(e){toast('Téléchargement impossible ici, utilise Copier')}break}

  // 2. saisies tardives (60 derniers jours)
  const tard=M.orders.filter(o=>o.enteredAt&&days(o.date,o.enteredAt)>3&&days(o.date,t)<=60).sort((a,b)=>a.enteredAt<b.enteredAt?1:-1);
  const tardHtml=tard.length?`<div class="rows">${tard.map(o=>`<div class="row"><div class="main"><b>${esc(o.vend)} · ${esc(M.names[o.cid]||o.cname||o.cid)}</b><small>vendu le ${dShort(o.date)} · saisi le ${dShort(o.enteredAt)} (${days(o.date,o.enteredAt)} j après)</small></div><div class="end num"><b>${fmt(oAmt(o))}</b><div class="pts" style="font-size:12.5px">${fp(oPts(o))} pts</div></div></div>`).join('')}</div>`:'<div class="empty">Aucune vente saisie en retard.</div>';
  // 3. lentes > 50 % des points et marge < 100 000, 2 mois de suite
  const flag=a=>a.pts>0&&a.ptsL/a.pts>0.5&&a.marge<100000;
  const sig=rows.filter(a=>flag(a)&&agg[prevYm(a.ym)+'|'+a.v]&&flag(agg[prevYm(a.ym)+'|'+a.v]));
  const sigHtml=sig.length?`<div class="rows">${sig.map(a=>`<div class="row"><div class="main"><b>${esc(a.v)}</b><small>${ymLabel(prevYm(a.ym))} et ${ymLabel(a.ym)} · ${a.src.has('Excel')?'≈ ':''}${Math.round(a.ptsL/a.pts*100)} % des points en lentes · marge ${fmt(a.marge)} HTG</small></div><div class="end"><span class="chip c-bad">À discuter</span></div></div>`).join('')}</div>`:'<div class="empty">Aucun agent concerné.</div>';
  // live: current month last-5-days share
  const live=rows.filter(a=>a.ym===cur&&a.src.has('App')&&a.pts>0&&lastDays(cur,5)(t));
  return card('Points faits les 5 derniers jours du mois','Dernier mois terminé, plus tous les mois au-dessus de 35 %. Au-dessus de 35 % : vérifier que les clients n\'ont pas été « remplis » pour atteindre l\'objectif (regarder s\'ils recommandent le mois suivant).',finHtml+(live.length?`<small class="muted">Mois en cours : ${live.map(a=>esc(a.v)+' '+Math.round(a.last5/a.pts*100)+' %').join(' · ')}</small>`:''))
   +card('Ventes saisies en retard','Ventes saisies plus de 3 jours après la date de vente (60 derniers jours). À vérifier : une vente du mois passé ne doit pas compter dans le mois en cours.',tardHtml)
   +card('Ventes enregistrées sans internet','Ventes des 60 derniers jours faites hors ligne, avec la confirmation par téléphone de la caisse. À comparer avec le stock si un écart apparaît.',(()=>{const off=M.orders.filter(o=>o.offline&&days(o.date,t)<=60).sort((a,b)=>a.date<b.date?1:-1);return off.length?`<div class="rows">${off.map(o=>`<div class="row"><div class="main"><b>${esc(o.vend)} · ${esc(M.names[o.cid]||o.cname||o.cid)}</b><small>${dShort(o.date)} · confirmé par appel avec ${esc(o.offline.avec||'la caisse')}${o.offline.note?' · '+esc(o.offline.note):''}</small></div><div class="end num"><b>${fq(o.lines.reduce((s2,l)=>s2+(+l.qty||0),0))}</b> <small class="muted">caisses</small></div></div>`).join('')}</div>`:'<div class="empty">Aucune vente hors ligne.</div>'})())
   +card('Beaucoup de lentes, peu de marge','Agents avec plus de 50 % des points en huiles lentes et moins de 100 000 HTG de marge payée, deux mois de suite. C\'est un sujet de discussion au comité, pas une sanction.',sigHtml);
}
// Encaissements : la caisse (Gesmane) confirme ou refuse les paiements déclarés par les vendeurs
function dirCaisse(M){
  const t=today(),list=M.orders.filter(o=>o.paidAt&&!o.confirmedAt).sort((a,b)=>a.paidAt<b.paidAt?-1:1);
  if(!list.length)return '<div class="card empty">Aucun paiement à confirmer. Les ventes cash, MonCash et les crédits encaissés apparaissent ici dès que les vendeurs les déclarent.</div>';
  const by={};list.forEach(o=>(by[o.vend]=by[o.vend]||[]).push(o));
  const pay={cash:'Cash',moncash:'MonCash',credit:'Crédit'};
  return `<p class="muted" style="margin:0;font-size:12.5px">Coche les ventes dont l'argent est bien arrivé (dépôt, MonCash, reçu), puis confirme. Les points du vendeur sont validés seulement après ta confirmation. Un refus remet la vente « non payée » chez le vendeur.</p>`+Object.entries(by).map(([v,os])=>`<section class="card stack">
    <div class="hstack" style="justify-content:space-between"><b style="font-size:16px">${esc(v)}</b><span class="num"><b>${fmt(os.reduce((s,o)=>s+oAmt(o),0))} HTG</b> <small class="muted">· ${os.length} vente(s)</small></span></div>
    <label class="hstack" style="font-size:13px"><input type="checkbox" data-allv="${esc(v)}"> Tout cocher</label>
    <div class="rows">${os.map(o=>{const late=days(o.date,o.paidAt)>DELAI;return `<label class="row" style="cursor:pointer"><input type="checkbox" data-pay="${esc(o.id)}" data-v="${esc(v)}" style="width:20px;height:20px"><div class="main"><b>${esc(M.names[o.cid]||o.cname||o.cid)}</b><small>${pay[o.pay]} · vendu le ${dShort(o.date)} · payé le ${dShort(o.paidAt)}${late?' · <span style="color:var(--bad)">payé après 14 j : pas de points</span>':''}</small></div><div class="end num"><b>${fmt(oAmt(o))}</b><div class="pts" style="font-size:12.5px">${fp(oPts(o))} pts</div></div></label>`}).join('')}</div>
    <div class="hstack"><button class="btn okb" data-act="dconfirm" data-v="${esc(v)}">Confirmer la sélection</button><button class="btn ghost" data-act="drefuse" data-v="${esc(v)}">Refuser</button></div>
  </section>`).join('');
}
function dirShell(){
  return `<header class="top"><div class="top-row">${LOGO}<div class="who"><b>Espace Direction</b><small>Elite Auto Parts · tous les vendeurs</small></div>
   <span class="net ${navigator.onLine?'':'off'}"><i></i>${navigator.onLine?'En ligne':'Hors ligne'}</span>
   <button class="icon-btn" data-act="dirback" aria-label="Retour">×</button></div></header><main id="dview"></main>`;
}
function dirRender(){

    <label class="f">Clé<input id="dkey" type="password" autocomplete="off"></label><button class="btn" data-act="dirlogin">Ouvrir</button>${D.err?`<span style="color:var(--bad)">${esc(D.err)}</span>`:''}</section>`;return}

    body=`<section class="card hero"><div class="month-nav"><span class="lbl">Équipe · ${MOIS[m-1]} ${y}</span><span class="hstack"><button data-act="dmprev" aria-label="Mois précédent">‹</button><button data-act="dmnext" aria-label="Mois suivant">›</button></span></div>
      <div class="big num">${fp(tot.valide)} <small>pts validés</small></div>
      <div class="hero-grid"><div><b class="num">${fp(tot.attente)}</b><small>pts en attente</small></div><div><b class="num">${fq(tot.cases)}</b><small>caisses</small></div><div><b class="num">${fmt(tot.amt)}</b><small>HTG vendus</small></div></div></section>
      ${S2.vend.length?'<div class="cards-grid">'+S2.vend.map(g=>{const pc=Math.min(100,g.valide/S2.objM*100);return `<section class="card stack">
        <div class="hstack" style="justify-content:space-between"><b style="font-size:16px">${esc(g.v)}</b><span class="chip ${g.feu==='g'?'c-ok':g.feu==='y'?'c-warn':'c-bad'}">Feu ${g.feu==='g'?'vert':g.feu==='y'?'jaune':'rouge'}</span></div>
        <div><div class="hstack" style="justify-content:space-between"><span class="num"><b class="pts" style="font-size:20px">${fp(g.valide)}</b> / ${fmt(S2.objM)} pts</span><span class="muted num">${Math.round(g.valide/S2.objM*100)} %</span></div><div class="mini-bar"><span class="${pc>=100?'done':''}" style="width:${pc}%"></span></div></div>
        <div class="kv">
          <div><b class="num">${fp(g.attente)}</b><small>pts en attente</small></div>
          <div><b class="num">${fp(g.today)}</b><small>pts aujourd'hui (≥ ${S2.perDay})</small></div>

          <div><b class="num">${g.clL.size}${(()=>{const pv=PREV[prevYm(D.ym)+'|'+g.v];if(!pv)return '';const d=g.clL.size-pv.nClL;return ` <small style="color:var(${d>=3?'--ok':d<0?'--bad':'--muted'})">${d>0?'+':''}${d}</small>`})()}</b><small>clients lentes (+3 vs mois passé)</small></div>
          <div><b class="num" style="${g.tard.length?'color:var(--warn)':''}">${g.tard.length}</b><small>vente(s) saisie(s) &gt; 3 j après</small></div>
        </div>
        ${g.late.length?`<span style="color:var(--bad);font-size:13px">${g.late.length} crédit(s) en retard · ${fmt(g.lateAmt)} HTG</span>`:''}
        <div class="rows">${catBars(g.catV,S2.cib,g.catA)}</div>
        <div class="stack" style="gap:4px;background:var(--bg);border-radius:10px;padding:10px"><div class="hstack" style="justify-content:space-between"><b>Salaire : ${fmt(g.sal.total)} HTG</b>${g.sal.garanti&&g.sal.total>g.sal.formule?'<span class="chip c-info">garantie</span>':''}${g.sal.accel?'<span class="chip c-ok">accélérateur</span>':''}</div>
          <small class="muted">Fixe ${fmt(g.sal.R.fixe)} + ${fp(Math.min(g.valide,S2.objM))} pts × ${String(g.sal.R.taux).replace('.',',')} = ${fmt(g.sal.base)}${g.sal.sup?` + ${fp(g.sal.sup)} pts × ${g.accelOk?String(g.sal.R.taux_accel).replace('.',','):String(g.sal.R.taux).replace('.',',')} = ${fmt(g.sal.extra)}`:''} · formule ${fmt(g.sal.formule)} HTG</small>
          ${g.valide>=S2.objM&&!g.accelOk?`<small style="color:var(--warn)">Accélérateur bloqué : ${[g.margeV<+M.remu.marge_min?'marge '+fmt(g.margeV)+' < '+fmt(M.remu.marge_min):'',(g.encPct??0)<+M.remu.pct_paye_min?'payé sous 14 j '+Math.round(g.encPct??0)+' % < '+M.remu.pct_paye_min+' %':''].filter(Boolean).join(' · ')}</small>`:''}</div>
      </section>`}).join('')+'</div>':`<div class="card empty">Aucune vente saisie dans l'app pour ce mois. Les ventes apparaissent ici dès que les téléphones des vendeurs se synchronisent.</div>`}`;
  } else if(D.tab==='credits'){
    const t=today(),all=M.orders.filter(o=>o.pay==='credit'&&!o.paidAt).sort((a,b)=>a.date<b.date?-1:1);

  } else if(D.tab==='caisse'){

    body=dirCarte(M);

  } else if(D.tab==='mois'){
    body=dirMonths(M);
  } else if(D.tab==='vendeurs'){
    const vs=(D.data&&D.data.vendeurs)||[];
    body=`<section class="card"><b>Vendeurs</b><div class="rows">${vs.map(x=>`<div class="row"><div class="main"><b>${esc(x.name)}</b></div><div class="end">${x.active?'<span class="chip c-ok">Actif</span>':'<span class="chip c-mute">Inactif</span>'}</div></div>`).join('')}</div></section>
    <section class="card stack"><b>Nouveau vendeur ou nouveau PIN</b><p class="muted" style="margin:0;font-size:13px">Pour un nouvel agent, écris son nom : il commencera avec un portefeuille vide. Pour un agent existant, le nouveau PIN remplace l'ancien.</p>
    <label class="f">Nom<input id="vname" list="vlist" autocomplete="off"><datalist id="vlist">${vs.map(x=>`<option value="${esc(x.name)}">`).join('')}</datalist></label>

    <button class="btn" data-act="dsetpin">Enregistrer</button></section>
    <section class="card stack"><b>Caisse à appeler et visites par jour</b><p class="muted" style="margin:0;font-size:12.5px">Quand un vendeur n'a pas internet, l'app lui demande d'activer internet ou d'appeler ce numéro pour confirmer le stock avant d'enregistrer.</p>
    <div class="grid2"><label class="f">Nom<input id="pc_nom" value="${esc((D.data&&D.data.parametres&&D.data.parametres.nom_caisse)||'Gesmane')}"></label><label class="f">Téléphone<input id="pc_tel" inputmode="tel" value="${esc((D.data&&D.data.parametres&&D.data.parametres.tel_caisse)||'')}" placeholder="3xxx xxxx"></label></div>
    <label class="f">Visites par jour (cible du feu « Visites »)<input id="pc_vis" type="number" inputmode="numeric" min="0" max="50" value="${(D.data&&D.data.parametres&&D.data.parametres.visites_jour)??8}"></label>
    <button class="btn sec" data-act="dsetparams">Enregistrer</button></section>
    <section class="card stack"><b>Clé Direction</b><p class="muted" style="margin:0;font-size:13px">Choisis une clé facile à retenir pour toi, au moins 8 caractères (par exemple une petite phrase). L'ancienne clé ne marchera plus, sur tous les appareils. Donne la nouvelle clé seulement à Steve, Abenson et Gesmane.</p>
    <label class="f">Nouvelle clé<input id="nk1" type="password" autocomplete="new-password"></label>

  } else {
    const rows=Object.values(M.grid).sort((a,b)=>a.sort-b.sort).map(r=>({...r,pts:+r.pts,prix_achat:M.cost[r.id]??''}));
    const ROT=rotation(M,rows);
    window.__ROT=ROT;
    body=`<section class="card stack"><b>Objectif par agent</b><div class="grid2"><label class="f">Mois<input id="gym" type="month" value="${D.ym}"></label><label class="f">Points<input id="gobj" type="number" inputmode="numeric" value="${S2.objM}"></label></div>
    <b style="font-size:13px">Caisses par catégorie</b><div class="grid2" style="grid-template-columns:repeat(3,minmax(0,1fr))">${['rapide','moyenne','lente'].map(c=>`<label class="f">${CAT[c][0]}<input id="gc_${c}" type="number" inputmode="numeric" value="${S2.cib[c]}"></label>`).join('')}</div>
    <button class="btn sec" data-act="dsaveobj">Enregistrer l'objectif</button></section>

    <p class="muted" style="margin:0;font-size:12.5px">Salaire = fixe + points validés × taux. Au-delà de l'objectif, le taux accéléré s'applique si la marge payée et le % payé sous 14 jours sont atteints. Jusqu'au mois de garantie, l'agent touche au moins la garantie.</p>
    <button class="btn sec" data-act="dsaveremu">Enregistrer la rémunération</button></section>
    <section class="card stack"><b>Grille du mois</b><p class="muted" style="margin:0;font-size:13px">Les téléphones reçoivent la nouvelle grille à la prochaine connexion. Les ventes déjà saisies gardent leurs points. Le prix d'achat reste visible seulement ici, jamais par les vendeurs.</p>
    <div style="overflow-x:auto"><table style="border-collapse:collapse;width:100%;min-width:1040px;font-size:14px"><thead><tr style="text-align:left;color:var(--muted);font-size:12px"><th style="padding:6px 4px">Huile</th><th>Catégorie</th><th>Ventes / mois</th><th>Jours / lot</th><th>Jours de stock</th><th>Suggestion</th><th>Stock dépôt</th><th>Pts</th><th>Prix achat</th><th>Prix HTG</th><th>Lot habituel</th></tr></thead><tbody>
    ${rows.map(r=>`<tr style="border-top:1px solid var(--line)"><td style="padding:6px 4px">${esc(r.name)}</td><td><select data-gc="${esc(r.id)}" aria-label="Catégorie ${esc(r.name)}" style="padding:6px;border:1px solid var(--line);border-radius:8px;background:var(--surface)">${['rapide','moyenne','lente'].map(c=>`<option value="${c}" ${r.categorie===c?'selected':''}>${CAT[c][0]}</option>`).join('')}</select></td>${(()=>{const r2=ROT[r.id]||{};return `<td style="text-align:center">${r2.vm==null?'-':fq(Math.round(r2.vm*10)/10)}</td><td style="text-align:center"><b>${r2.jl==null?'-':r2.jl>365?'> 365':Math.round(r2.jl)}</b></td><td style="text-align:center">${(+r.stock||0)<=0?'<span class="chip c-bad">rupture</span>':r2.jours==null?'-':r2.jours>365?'> 365':Math.round(r2.jours)}</td><td style="text-align:center">${r2.sug?(r2.sug==='rupture'?'<span class="chip c-mute">rupture</span>':`<span class="chip ${r2.sug===r.categorie?'c-mute':CAT[r2.sug][1]}" title="${r2.sug===r.categorie?'Catégorie actuelle confirmée':'Changement suggéré'}">${CAT[r2.sug][0]}${r2.sug===r.categorie?'':' ←'}</span>`):'-'}</td>`})()}<td style="text-align:center" title="Le stock se modifie dans l'onglet Stock">${fq(+r.stock||0)}</td>${['pts','prix_achat','price','lot'].map(k=>`<td><input data-g="${esc(r.id)}" data-k="${k}" value="${r[k]}" inputmode="decimal" aria-label="${k} ${esc(r.name)}" style="width:76px;padding:6px;border:1px solid var(--line);border-radius:8px;background:var(--surface)"></td>`).join('')}</tr>`).join('')}
    </tbody></table></div>
    <p class="muted" style="margin:0;font-size:12.5px">Ventes / mois : moyenne de ${ymLabel(prevYm(prevYm(today().slice(0,7))))} et ${ymLabel(prevYm(today().slice(0,7)))}. Jours / lot = lot habituel ÷ ventes par jour : c'est la vitesse de l'huile, et la base de la suggestion (30 jours ou moins = rapide, 31 à 90 = moyenne, plus de 90 = lente). Jours de stock = stock dépôt ÷ ventes par jour. Le lot habituel vient de la feuille Stock ; modifie-le si tes achats changent.</p>
    <div class="hstack"><button class="btn sec" data-act="dapplysug">Appliquer les suggestions</button><button class="btn" data-act="dsavegrid">Publier la grille</button></div></section>`;
  }
  v.innerHTML=`<div class="seg">${tabs.map(([k,l])=>`<button data-act="dtab" data-f="${k}" class="${D.tab===k?'on':''}">${l}</button>`).join('')}</div>
   <div class="hstack" style="justify-content:space-between;font-size:12.5px"><span class="muted">${D.loading?'Chargement…':D.fetchedAt?'Données du '+new Date(D.fetchedAt).toLocaleString('fr-FR'):''}${M.qbo?' · QuickBooks connecté ('+esc(M.qbo.environment)+')':' · QuickBooks non connecté'}</span><button class="btn sm ghost" data-act="dreload">Actualiser</button></div>
   ${D.err?`<div class="card" style="color:var(--bad)">${esc(D.err)}</div>`:''}${body}
   <button class="btn ghost" data-act="dlogout">Fermer la session Direction</button>`;
  if(D.tab==='carte')initDirMap(M);else if(MAP){try{MAP.remove()}catch(e){}MAP=null}
}
document.addEventListener('change',e=>{if(e.target.dataset&&e.target.dataset.mv){D.mv=e.target.value;dirRender();return}if(e.target.id==='tk_v'){D.trk={vendor:e.target.value,date:null,pts:null};D.trk.pts=null;dirRender();return}if(e.target.id==='pa_prod'){const M=dirModel(),v2=e.target.value;$('#pa_new').hidden=v2!=='__new';if(v2!=='__new')$('#pa_prix').value=M.cost[v2]||'';return}const v=e.target.dataset&&e.target.dataset.allv;if(v)document.querySelectorAll('[data-pay][data-v="'+CSS.escape(v)+'"]').forEach(i=>i.checked=e.target.checked)});
document.addEventListener('click',async e=>{
  const t=e.target.closest('[data-act]');if(!t)return;const a=t.dataset.act;
  if(a==='godir'){closeSheet();route='dir';render();if(D.key)dirLoad();}
  else if(a==='dirback'){route='app';render()}
  else if(a==='dirlogin'){D.key=($('#dkey').value||'').trim();if(!D.key)return;D.err=null;await dirLoad();if(D.err&&/incorrecte/.test(D.err)){D.key=null;dirSave();dirRender()}else dirSave()}
  else if(a==='dlogout'){D={key:null,data:null,loading:false,err:null,ym:today().slice(0,7),tab:'equipe',fetchedAt:null};try{localStorage.removeItem(DIR_KEY)}catch(e){}dirRender()}
  else if(a==='dtab'){D.tab=t.dataset.f;dirRender()}
  else if(a==='dreload')dirLoad();
  else if(a==='dmprev'||a==='dmnext'){const [y,m]=D.ym.split('-').map(Number);D.ym=iso(new Date(y,m-1+(a==='dmnext'?1:-1),1)).slice(0,7);dirRender()}
  else if(a==='dsetpin'){try{await dirCall({action:'setPin',vendor:$('#vname').value,pin:$('#vpin').value});toast('Vendeur enregistré');dirLoad()}catch(err){toast(err.message)}}
  else if(a==='dchangekey'){
    const k1=$('#nk1').value,k2=$('#nk2').value,msg=$('#nkmsg');
    if(k1.trim().length<8){msg.innerHTML='<span style="color:var(--bad)">Au moins 8 caractères.</span>';return}
    if(k1!==k2){msg.innerHTML='<span style="color:var(--bad)">Les deux clés ne sont pas pareilles.</span>';return}
    try{await dirCall({action:'changeKey',newKey:k1});D.key=k1;dirSave();$('#nk1').value='';$('#nk2').value='';msg.innerHTML='<span style="color:var(--ok)">Clé changée. Elle est gardée sur cet appareil.</span>';toast('Clé Direction changée')}catch(err){msg.innerHTML='<span style="color:var(--bad)">'+esc(err.message)+'</span>'}
  }
  else if(a==='dapplysug'){const R=window.__ROT||{};let n=0;document.querySelectorAll('[data-gc]').forEach(sel=>{const s2=(R[sel.dataset.gc]||{}).sug;if(s2&&s2!=='rupture'&&sel.value!==s2){sel.value=s2;n++}});toast(n?n+' catégorie(s) changée(s) : vérifie les points puis publie':'Aucun changement suggéré')}
  else if(a==='papay'){document.querySelectorAll('#pa_pay button').forEach(b=>b.classList.toggle('on',b===t));$('#pa_ech_w').hidden=t.dataset.v!=='credit'}
  else if(a==='dpurchase'){
    let prod=$('#pa_prod').value;const pay=(document.querySelector('#pa_pay .on')||{}).dataset?.v||'cash';
    const num=id=>parseFloat(String($(id).value).replace(',','.'));
    t.disabled=true;
    try{
      if(prod==='__new'){const r=await dirCall({action:'addProduct',produit:{name:$('#np_name').value,categorie:$('#np_cat').value,pts:num('#np_pts'),price:num('#np_price'),prix_achat:num('#pa_prix'),lot:num('#pa_qte')}});prod=r.id}
      await dirCall({action:'addPurchase',achat:{produit:prod,date:$('#pa_date').value,quantite:num('#pa_qte'),prix_achat:num('#pa_prix'),fournisseur:$('#pa_four').value,paiement:pay,echeance:$('#pa_ech').value,maj_prix:$('#pa_maj').checked,dispo:$('#pa_dispo').checked,note:$('#pa_note').value}});
      toast('Achat enregistré : stock mis à jour');dirLoad();
    }catch(err){t.disabled=false;toast(err.message)}}
  else if(a==='dsetdispo'||a==='dsetdispoall'){const pid=$('#dp_prod').value,r=(dirModel().grid[pid]||{}),n=a==='dsetdispoall'?Math.max(0,(+r.stock||0)-(+r.engage||0)):parseFloat(String($('#dp_n').value).replace(',','.'));
    if(!(n>=0)){toast('Écris le nombre de caisses disponibles');return}t.disabled=true;
    try{const res=await dirCall({action:'setDispo',produit:pid,dispo:n});toast('Disponible vendeurs : '+fq(Math.max(0,(+r.stock||0)-(+res.reserve||0)-(+r.engage||0)))+' caisse(s) · réserve '+fq(+res.reserve||0));dirLoad()}catch(err){t.disabled=false;toast(err.message)}}
  else if(a==='dsetparams'){try{await dirCall({action:'setParams',nom_caisse:$('#pc_nom').value,tel_caisse:$('#pc_tel').value,visites_jour:$('#pc_vis').value});toast('Enregistré : les téléphones le recevront à leur prochaine connexion');dirLoad()}catch(err){toast(err.message)}}
  else if(a==='dinventaire'){t.disabled=true;try{const r=await dirCall({action:'inventaire',produit:$('#iv_prod').value,compte:parseFloat(String($('#iv_n').value).replace(',','.')),note:$('#iv_note').value});toast('Comptage enregistré · écart '+(r.ecart>0?'+':'')+fq(+r.ecart)+' caisse(s)');dirLoad()}catch(err){t.disabled=false;toast(err.message)}}
  else if(a==='dsupplierpaid'){t.disabled=true;try{await dirCall({action:'supplierPaid',id:+t.dataset.id});toast('Dette fournisseur marquée payée');dirLoad()}catch(err){t.disabled=false;toast(err.message)}}
  else if(a==='dmf'){D.mf[t.dataset.f]=!D.mf[t.dataset.f];dirRender()}
  else if(a==='dtrack'){const v=$('#tk_v').value,d=$('#tk_date').value;if(!d){toast('Aucune tournée enregistrée pour ce vendeur');return}t.disabled=true;
    try{const r=await dirCall({action:'track',vendor:v,date:d});D.trk={vendor:v,date:d,pts:r.pts||[]};dirRender()}catch(err){t.disabled=false;toast(err.message)}}
  else if(a==='dtrackoff'){D.trk=null;dirRender()}
  else if(a==='dsaveremu'){const remu={};['fixe','taux','taux_accel','marge_min','pct_paye_min','garantie'].forEach(k=>remu[k]=parseFloat(String($('#rm_'+k).value).replace(',','.')));remu.garantie_jusqu_a=$('#rm_garantie_jusqu_a').value;
    try{await dirCall({action:'setRemuneration',remu});toast('Rémunération enregistrée');dirLoad()}catch(err){toast(err.message)}}
  else if(a==='dconfirm'||a==='drefuse'){
    const v=t.dataset.v,ids=[...document.querySelectorAll('[data-pay][data-v="'+CSS.escape(v)+'"]')].filter(i=>i.checked).map(i=>i.dataset.pay);
    if(!ids.length){toast('Coche au moins une vente');return}
    t.disabled=true;
    try{const r=await dirCall({action:'confirmPayments',ids,decision:a==='dconfirm'?'confirme':'refuse'});toast((a==='dconfirm'?'Confirmé : ':'Refusé : ')+r.count+' vente(s)');dirLoad()}catch(err){t.disabled=false;toast(err.message)}}
  else if(a==='dsaveobj'){try{await dirCall({action:'setObjective',ym:$('#gym').value,points:+$('#gobj').value,cible_rapide:+$('#gc_rapide').value,cible_moyenne:+$('#gc_moyenne').value,cible_lente:+$('#gc_lente').value});toast('Objectif publié');dirLoad()}catch(err){toast(err.message)}}
  else if(a==='dsavegrid'){
    const M=dirModel(),rows=Object.values(M.grid).map(r=>({...r,prix_achat:M.cost[r.id]}));
    document.querySelectorAll('[data-gc]').forEach(i=>{const r=rows.find(x=>x.id===i.dataset.gc);if(r)r.categorie=i.value});
    document.querySelectorAll('[data-g]').forEach(i=>{const r=rows.find(x=>x.id===i.dataset.g);if(r)r[i.dataset.k]=parseFloat(String(i.value).replace(',','.'))||0});
    try{await dirCall({action:'setGrid',rows});toast('Grille publiée');dirLoad()}catch(err){toast(err.message)}
  }
});

/* ---------- boot ---------- */
S=load();
if(S&&!S.sync.url){S.sync.url=SERVER_URL;S.sync.key=SERVER_KEY;save()}
render();
if(S&&S.tour&&S.tour.active){if(S.tour.date!==today()){flushTour(true);(S.tours=S.tours||{})[S.tour.date]=S.tour.pts.map(p=>p.slice(0,3));S.tour.active=false;save()}else startWatch()}
if(S){pullConfig(true);pullDecisions(true);trySync();setTimeout(()=>notifySummary(false),1500)}
try{if('serviceWorker' in navigator&&location.protocol.startsWith('http')&&window.__PWA__)navigator.serviceWorker.register('sw.js')}catch(e){}
</script>

</body></html>
